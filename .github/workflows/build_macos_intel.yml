name: build-macos-intel

# 在 M1 runner (macos-latest) 上交叉编译 Intel (x86_64) 版本
# 通过 ARCHS / CMAKE_OSX_ARCHITECTURES 环境变量指定目标架构
# 编译完成后可直接在 Mac Mini 2010 (Intel) 上运行

on:
  # 手动触发：在 GitHub Actions 页面点击 "Run workflow"
  workflow_dispatch:
  # 推送 Tag 时自动触发
  push:
    tags:
      - "v*"

jobs:
  build-macos-intel:
    # 使用 M1 runner，通过环境变量交叉编译 x86_64 (Intel) 二进制
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Flutter 3.47.2 — 满足 dart_quickjs (Dart ^3.10.0) 要求
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      # 获取依赖
      - name: Restore packages
        run: |
          cd simple_live_core
          flutter pub get
          cd ../simple_live_app
          flutter pub get

      # 安装打包工具
      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # 编译 macOS (Intel x86_64) — 交叉编译
      # ARCHS: Xcode/macOS 构建系统目标架构
      # CMAKE_OSX_ARCHITECTURES: CMake 目标架构 (dart_quickjs native_toolchain_c)
      - name: Build macOS
        env:
          ARCHS: x86_64
          CMAKE_OSX_ARCHITECTURES: x86_64
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 上传为 Artifact（Actions 页面直接下载，保留 90 天）
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-macOS-Intel
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip

      # 推送 Tag 时自动上传到 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip
          generate_release_notes: true
